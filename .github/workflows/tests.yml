name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # app.py claims Python 3.9+ (see pyproject.toml), so prove it on the oldest and the newest.
        #
        # The runner image is pinned per Python version on purpose. `ubuntu-latest` has migrated to
        # Ubuntu 26.04, and actions/python-versions only publishes 3.9 builds for Ubuntu 22.04 and
        # 24.04 — Python 3.9 is past end of life, so there is no 26.04 build to install and the
        # setup-python step fails with "The version '3.9' with architecture 'x64' was not found
        # for Ubuntu 26.04". The 3.9 leg therefore runs on ubuntu-24.04, where the build exists.
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        # No key, no network: the suite mocks Groq and boots the HTTP server on a local port.
        run: python test_agent.py

      - name: Check the app starts and serves the page
        run: |
          # Redirect the server's output so it does not hold the step open, and stop it again.
          python app.py > server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:8000/ | grep -q "Merchant chat"
          curl -fsS http://127.0.0.1:8000/api/merchants | grep -q "M001"
          kill $SERVER_PID
